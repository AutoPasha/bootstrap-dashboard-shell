name: safari-inspector

on:
  push:
    branches: [qa/safari-inspector]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspector:
    name: Web Inspector, Safari macos-15
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo safaridriver --enable
      - run: python3 -m pip install --break-system-packages selenium==4.27.1
      - run: python3 qa-inspector/inspector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-inspector
          path: qa-inspector/out
